[project]
name = "schoolriscv-pc-host"
version = "0.1.0"
description = "PC-side UART memory agent for schoolRISCV FPGA"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
uart-agent = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
py-modules = ["main"]